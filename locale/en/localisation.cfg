[mod-setting-description]
yasi-paste-inserter-directions=Whether to transfer the configuration of inserter arms when pasting settings with __CONTROL__copy-entity-settings__ and __CONTROL__paste-entity-settings__. Can be toggled during gameplay with __CONTROL__toggle-yasi-paste-inserter-directions__.
yasi-paste-inserter-directions-notify=Show a message in game chat when __CONTROL__toggle-yasi-paste-inserter-directions__ is pressed to change the Paste inserter arms configuration setting.

[mod-setting-change]
yasi-paster-inserter-directions-off=Pasting inserter arms configuration is OFF
yasi-paster-inserter-directions-on=Pasting inserter arms configuration is ON

[command]
yasi-fix-inserters=Attempt to make all inserters on the current surface conform to YASI.
